<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setores | EcoGestão</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark navbar-eco">
    <div class="container">
      <a class="navbar-brand" href="index.html">EcoGestão</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="agua.html">Água</a></li>
          <li class="nav-item"><a class="nav-link" href="energia.html">Energia</a></li>
          <li class="nav-item"><a class="nav-link" href="residuos.html">Resíduos</a></li>
          <li class="nav-item"><a class="nav-link" href="setores.html">Setores</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div id="alertas"></div>

  <main class="container my-4">
    <h1 class="h3 mb-4">Setores</h1>

    <div class="row g-4">
      <!-- Formulário de cadastro -->
      <div class="col-lg-4">
        <div class="card">
          <div class="card-body">
            <h2 class="h5 mb-3">Novo setor</h2>
            <form id="form-setor" novalidate>
              <div class="mb-3">
                <label for="nome" class="form-label">Nome *</label>
                <input type="text" class="form-control" id="nome" maxlength="100" required>
              </div>
              <div class="mb-3">
                <label for="descricao" class="form-label">Descrição</label>
                <textarea class="form-control" id="descricao" rows="3" maxlength="255"></textarea>
              </div>
              <button type="submit" class="btn btn-eco w-100" id="btn-salvar">Cadastrar</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Lista de setores -->
      <div class="col-lg-8">
        <div class="card">
          <div class="card-body">
            <h2 class="h5 mb-3">Setores cadastrados</h2>
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead>
                  <tr>
                    <th style="width: 70px;">ID</th>
                    <th>Nome</th>
                    <th>Descrição</th>
                  </tr>
                </thead>
                <tbody id="tabela-setores">
                  <tr><td colspan="3" class="estado-vazio">Carregando...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/setores.js"></script>
</body>
</html>
