$kind: http-request
url: "{{baseUrl}}/api/inexistente"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 404", function () { pm.response.to.have.status(404); });
      var j = pm.response.json();
      pm.test("Corpo de erro padronizado", function () { pm.expect(j).to.have.keys("timestamp","status","erro","mensagem"); pm.expect(j.status).to.eql(pm.response.code); });
      pm.test("Categoria: Endereço não encontrado", function () { pm.expect(j.erro).to.eql("Endereço não encontrado"); });
    language: text/javascript
order: 3000
