$kind: http-request
url: "{{baseUrl}}/api/agua?dataInicio=abc&dataFim=2026-10-31"
method: GET
queryParams:
  dataInicio: abc
  dataFim: 2026-10-31
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 400", function () { pm.response.to.have.status(400); });
      var j = pm.response.json();
      pm.test("Corpo de erro padronizado", function () { pm.expect(j).to.have.keys("timestamp","status","erro","mensagem"); pm.expect(j.status).to.eql(pm.response.code); });
      pm.test("Categoria: Parâmetro inválido", function () { pm.expect(j.erro).to.eql("Parâmetro inválido"); });
    language: text/javascript
order: 6000
