$kind: http-request
url: "{{baseUrl}}/api/residuos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "setor": { "id": {{setorId}} },
      "data": "2026-10-01",
      "tipo": "Papel",
      "quantidade": 45.50,
      "destinacao": "Reciclagem"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 201", function () { pm.response.to.have.status(201); });
      if (pm.response.code === 201) { pm.collectionVariables.set("residuoId", pm.response.json().id); }
    language: text/javascript
order: 1000
